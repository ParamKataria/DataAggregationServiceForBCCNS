[project]
name = "bccns-metadata-scraper"
version = "0.1.0"
description = "Harvest public Black history collection pages into a Dublin Core CSV."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
]

[project.scripts]
scrape-metadata = "scraper.__main__:main"
scrape-desk = "scraper.desk:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]
